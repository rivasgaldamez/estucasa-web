<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Fuente vendorizada localmente — sin Google Fonts */
      @font-face {
        font-family: "Bebas Neue";
        src: url("./assets/fonts/BebasNeue-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Bebas Neue", sans-serif;
        background: linear-gradient(180deg, #0d2060 0%, #0b1a4d 42%, #050a1e 78%, #000000 100%);
      }
      #vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 70% 52% at 50% 46%,
                    rgba(255,255,255,0.055) 0%, rgba(0,0,0,0) 70%);
      }

      #particles { position: absolute; inset: 0; overflow: hidden; }
      .pt {
        position: absolute;
        border-radius: 50%;
        background: #f5a800;
        filter: blur(1.5px);
        will-change: transform, opacity;
      }

      .phrase {
        position: absolute;
        left: 0; right: 0;
        text-align: center;
        white-space: nowrap;
      }
      #p1 { top: 820px; }
      #p2 { top: 820px; }
      #p3 { top: 840px; }

      .w {
        display: inline-block;
        color: #ffffff;
        font-size: 190px;
        line-height: 1;
        letter-spacing: 0.02em;
        margin: 0 22px;
        will-change: transform, opacity, filter;
      }
      .gold { color: #f5a800; }
      /* renglones largos: al entrar a scale 1.4 la palabra no debe salirse del cuadro */
      #p2 .w { font-size: 138px; margin: 0 18px; }
      #p3 .w { font-size: 146px; margin: 0 18px; }

      .rule {
        position: absolute;
        left: 50%;
        width: 420px; height: 6px;
        margin-left: -210px;
        background: #00c9a7;
        transform-origin: 0% 50%;
        border-radius: 3px;
      }
      #r1 { top: 1055px; }
      #r2 { top: 1055px; }
      #r3 { top: 1040px; }

      #plate {
        position: absolute;
        left: 270px; top: 700px;
        width: 540px; height: 540px;
        border-radius: 48px;
        background: #f8f3e9;
        box-shadow: 0 0 0 3px rgba(245,168,0,0.9), 0 40px 100px rgba(0,0,0,0.45);
      }
      #logo {
        position: absolute;
        left: 340px; top: 770px;
        width: 400px; height: 400px;
        display: block;
      }
      #flash {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 50%, #ffe7ad 0%, #f5a800 45%, rgba(245,168,0,0) 78%);
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1080"
      data-height="1920"
    >
      <div id="vignette" class="clip" data-start="0" data-duration="8" data-track-index="0"></div>
      <div id="particles" class="clip" data-layout-allow-overflow data-start="0" data-duration="8" data-track-index="1"></div>

      <div id="p1" class="phrase clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="0" data-duration="2.6" data-track-index="2"
        ><span class="w">TU</span><span class="w gold">CASA</span></div>
      <div id="r1" class="rule clip" data-start="0" data-duration="2.6" data-track-index="3"></div>

      <div id="p2" class="phrase clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="2.3" data-duration="2.5" data-track-index="4"
        ><span class="w">EN</span><span class="w">EL</span><span class="w gold">SALVADOR</span></div>
      <div id="r2" class="rule clip" data-start="2.3" data-duration="2.5" data-track-index="5"></div>

      <div id="p3" class="phrase clip" data-layout-allow-overlap data-layout-allow-occlusion data-start="4.5" data-duration="2.3" data-track-index="6"
        ><span class="w">DESDE</span><span class="w">DONDE</span><span class="w">ESTÉS</span></div>
      <div id="r3" class="rule clip" data-start="4.5" data-duration="2.3" data-track-index="7"></div>

      <div id="plate" class="clip" data-start="6.5" data-duration="1.5" data-track-index="8"></div>
      <img id="logo" class="clip" src="./assets/img/logo.png" alt=""
           data-start="6.5" data-duration="1.5" data-track-index="9" />
      <div id="flash" class="clip" data-start="6.4" data-duration="1.0" data-track-index="10"></div>
    </div>

    <script>
      /* ---------- PRNG determinista: mulberry32. Nada de Math.random ---------- */
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(20260926);

      /* ---------- partículas doradas ---------- */
      const PARTICLES = 34;
      const host = document.getElementById("particles");
      const pts = [];
      for (let i = 0; i < PARTICLES; i++) {
        const d = document.createElement("div");
        d.className = "pt";
        const size = 4 + rand() * 12;
        d.style.width = size + "px";
        d.style.height = size + "px";
        d.style.left = (rand() * 1080).toFixed(1) + "px";
        d.style.top = (rand() * 1920).toFixed(1) + "px";
        host.appendChild(d);
        pts.push({ el: d, rise: 120 + rand() * 260, drift: (rand() - 0.5) * 90,
                   dur: 4.5 + rand() * 3.5, delay: rand() * 2.2, peak: 0.16 + rand() * 0.34 });
      }

      /* ---------- timeline única, pausada ---------- */
      const tl = gsap.timeline({ paused: true });

      pts.forEach((p) => {
        gsap.set(p.el, { opacity: 0, xPercent: 0, yPercent: 0 });
        tl.to(p.el, { y: -p.rise, x: p.drift, duration: p.dur, ease: "none" }, p.delay);
        tl.to(p.el, { opacity: p.peak, duration: p.dur * 0.35, ease: "power1.out" }, p.delay);
        tl.to(p.el, { opacity: 0, duration: p.dur * 0.45, ease: "power1.in" },
              p.delay + p.dur * 0.55);
      });

      /* ---------- frases: palabra por palabra ---------- */
      const WORD_IN = 0.40;   // duración de entrada por palabra
      const WORD_GAP = 0.15;  // separación entre palabras
      const OUT = 0.42;       // salida: sube, se desenfoca y se apaga

      function phrase(sel, ruleSel, t0, tOut) {
        const words = gsap.utils.toArray(sel + " .w");
        gsap.set(words, { opacity: 0, scale: 1.4, y: 0, filter: "blur(0px)",
                          transformOrigin: "50% 50%" });
        gsap.set(ruleSel, { scaleX: 0, opacity: 0 });

        words.forEach((w, i) => {
          tl.to(w, { opacity: 1, scale: 1, duration: WORD_IN, ease: "back.out(2.1)" },
                t0 + i * WORD_GAP);
        });

        // la línea teal se dibuja de izquierda a derecha bajo el texto
        tl.to(ruleSel, { opacity: 1, duration: 0.10 }, t0 + 0.10);
        tl.to(ruleSel, { scaleX: 1, duration: 0.70, ease: "power2.out" }, t0 + 0.10);

        // salida: sube con blur
        tl.to(words, { y: -90, opacity: 0, filter: "blur(13px)",
                       duration: OUT, ease: "power2.in", stagger: 0.04 }, tOut);
        tl.to(ruleSel, { opacity: 0, y: -60, duration: OUT * 0.8, ease: "power2.in" }, tOut);
      }

      phrase("#p1", "#r1", 0.25, 2.05);
      phrase("#p2", "#r2", 2.40, 4.20);
      phrase("#p3", "#r3", 4.60, 6.25);

      /* ---------- cierre: destello dorado + logo ---------- */
      gsap.set(["#plate", "#logo"], { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" });
      gsap.set("#flash", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" });

      tl.to("#flash", { opacity: 0.95, scale: 1.25, duration: 0.16, ease: "power2.out" }, 6.46);
      tl.to("#flash", { opacity: 0, scale: 1.7, duration: 0.55, ease: "power2.in" }, 6.62);
      tl.to(["#plate", "#logo"], { opacity: 1, scale: 1, duration: 0.55,
                                   ease: "back.out(1.6)" }, 6.55);
      tl.to(["#plate", "#logo"], { scale: 1.03, duration: 0.85, ease: "power1.out" }, 7.12);

      /* expuesta como window.tl (requisito) y en el registro de HyperFrames */
      window.tl = tl;
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
