<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Bebas Neue vendorizada — sin Google Fonts */
      @font-face {
        font-family: "Bebas Neue";
        src: url("./assets/fonts/BebasNeue-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Bebas Neue", sans-serif;
        background: linear-gradient(180deg, #0d2060 0%, #0b1a4d 40%, #050a1e 76%, #000000 100%);
      }
      #vignette {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 62% 44% at 50% 45%, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0) 62%),
          radial-gradient(ellipse 78% 62% at 50% 48%, rgba(0,0,0,0) 48%, rgba(0,0,0,0.55) 100%);
      }

      /* escenario 3D */
      #stage {
        position: absolute;
        left: 0; right: 0; top: 600px;
        perspective: 800px;
        text-align: center;
      }
      .line { display: block; white-space: nowrap; }
      #l1 { font-size: 150px; line-height: 1.30; }
      #l2 { font-size: 210px; line-height: 1.26; }
      #l3 { font-size: 118px; line-height: 1.40; letter-spacing: 0.10em; }

      .ltr {
        position: relative;
        display: inline-block;
        color: #ffffff;
        transform-origin: 50% 100%;
        will-change: transform, opacity;
      }
      .ltr.gold { color: #f5a800; }
      .ltr.sp { width: 0.34em; }

      /* piezas del shatter: copias recortadas del mismo glifo */
      .base { display: inline-block; will-change: opacity; }
      .frag {
        position: absolute;
        left: 0; top: 0;
        display: inline-block;
        color: inherit;
        opacity: 0;
        will-change: transform, opacity, filter;
        pointer-events: none;
      }

      /* barrido de luz diagonal */
      #sweep {
        position: absolute;
        top: -260px;
        left: 0;
        width: 420px; height: 2440px;
        transform: rotate(18deg);
        background: linear-gradient(90deg,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,0.10) 34%,
          rgba(255,248,224,0.85) 50%,
          rgba(255,255,255,0.10) 66%,
          rgba(255,255,255,0) 100%);
        mix-blend-mode: screen;
        opacity: 0;
        pointer-events: none;
      }

      #plate {
        position: absolute;
        left: 280px; top: 720px;
        width: 520px; height: 520px;
        border-radius: 46px;
        background: #f8f3e9;
        box-shadow: 0 0 0 3px rgba(245,168,0,0.9), 0 36px 90px rgba(0,0,0,0.45);
      }
      #logo {
        position: absolute;
        left: 345px; top: 785px;
        width: 390px; height: 390px;
        display: block;
      }
      #flash {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 50%, #fff2cf 0%, #f5a800 42%, rgba(245,168,0,0) 74%);
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1080"
      data-height="1920"
    >
      <div id="vignette" class="clip" data-start="0" data-duration="8" data-track-index="0"></div>

      <div id="stage" class="clip" data-layout-allow-overlap data-layout-allow-occlusion
           data-start="0" data-duration="6.6" data-track-index="1">
        <span class="line" id="l1"></span>
        <span class="line" id="l2"></span>
        <span class="line" id="l3"></span>
      </div>

      <div id="sweep" class="clip" data-layout-allow-overflow
           data-start="3" data-duration="2.6" data-track-index="2"></div>

      <div id="plate" class="clip" data-start="6.55" data-duration="1.45" data-track-index="3"></div>
      <img id="logo" class="clip" src="./assets/img/logo.png" alt=""
           data-start="6.55" data-duration="1.45" data-track-index="4" />
      <div id="flash" class="clip" data-start="6.4" data-duration="1.0" data-track-index="5"></div>
    </div>

    <script>
      /* ============ PRNG determinista — mulberry32. Cero Math.random ============ */
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const SEED = 20260926;
      const rnd = mulberry32(SEED);                 // stream para el build (orden fijo)
      // hash posicional: puro en (i, step) -> seek-safe, no depende del frame anterior
      function hash01(i, step) {
        return mulberry32((SEED ^ Math.imul(i + 1, 2654435761) ^ Math.imul(step + 1, 40503)) | 0)();
      }

      /* ============ construcción del texto ============ */
      const ALFA = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const LINES = [
        { el: document.getElementById("l1"), text: "ES",           gold: [] },
        { el: document.getElementById("l2"), text: "TU CASA",      gold: [3, 4, 5, 6] },
        { el: document.getElementById("l3"), text: "INMOBILIARIA", gold: [] },
      ];
      const FRAGS = 3; // trozos por letra

      LINES.forEach((L) => {
        L.letters = [];
        [...L.text].forEach((ch, i) => {
          const s = document.createElement("span");
          s.className = "ltr" + (ch === " " ? " sp" : "") + (L.gold.includes(i) ? " gold" : "");
          if (ch === " ") { L.el.appendChild(s); return; }
          const base = document.createElement("span");
          base.className = "base";
          base.textContent = ch;
          s.appendChild(base);
          // clones recortados para el shatter (conservan el color de la letra)
          const fr = [];
          for (let k = 0; k < FRAGS; k++) {
            const f = document.createElement("span");
            f.className = "frag";
            f.textContent = ch;
            const a = (k / FRAGS) * 100, b = ((k + 1) / FRAGS) * 100;
            f.style.clipPath = `polygon(-20% ${a}%, 120% ${a}%, 120% ${b}%, -20% ${b}%)`;
            s.appendChild(f);
            fr.push(f);
          }
          L.el.appendChild(s);
          L.letters.push({ el: s, base: base, ch: ch, frags: fr });
        });
      });
      const ALL = LINES.flatMap((L) => L.letters);

      /* ============ timeline única, pausada ============ */
      const tl = gsap.timeline({ paused: true });

      /* ---- 1) 0.0–1.5  SCRAMBLE, se fija de izquierda a derecha ---- */
      const SCR_END = 1.5, STEP = 1 / 16; // 16 cambios por segundo
      const scr = { p: 0 };
      tl.to(scr, {
        p: 1, duration: SCR_END, ease: "none",
        onUpdate: () => {
          const t = scr.p * SCR_END;
          const step = Math.floor(t / STEP);
          LINES.forEach((L) => {
            const n = L.letters.length;
            L.letters.forEach((lt, i) => {
              // cada letra se fija en orden L->R, la última al 88% de la fase
              const lock = (i / Math.max(n - 1, 1)) * SCR_END * 0.88;
              lt.base.firstChild.nodeValue = (t >= lock)
                ? lt.ch
                : ALFA[Math.floor(hash01(i + L.text.length * 31, step) * 26)];
            });
          });
        }
      }, 0);
      gsap.set(ALL.map((l) => l.el), { opacity: 0.62 });
      tl.to(ALL.map((l) => l.el), { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.1);

      /* ---- 2) 1.5–3.0  SLIDE con rotationX 3D ---- */
      LINES.forEach((L, li) => {
        tl.fromTo(L.letters.map((l) => l.el),
          { y: 70, rotationX: -90, opacity: 0 },
          { y: 0, rotationX: 0, opacity: 1, duration: 0.62,
            ease: "back.out(1.6)", stagger: 0.04,
            // sin esto GSAP aplica el estado inicial en el build y el scramble
            // nunca se veria (fromTo tiene immediateRender = true por defecto)
            immediateRender: false },
          1.5 + li * 0.25);
      });

      /* ---- 3) 3.0–5.5  GLOW dorado + barrido de luz (2 pasadas) ---- */
      const glow = { i: 0 };
      tl.to(glow, {
        i: 1, duration: 2.5, ease: "none",
        onUpdate: () => {
          // dos pulsos completos de intensidad
          const k = (1 - Math.cos(glow.i * Math.PI * 4)) / 2; // 0..1, 2 ciclos
          const r = 10 + k * 34, o = 0.30 + k * 0.55;
          const css = `0 0 ${r}px rgba(245,168,0,${o}), 0 0 ${r * 2.4}px rgba(245,168,0,${o * 0.5})`;
          LINES.forEach((L) => { L.el.style.textShadow = css; });
          document.getElementById("stage").style.filter =
            `drop-shadow(0 0 ${6 + k * 16}px rgba(245,168,0,${0.20 + k * 0.35}))`;
        }
      }, 3.0);
      tl.set(LINES.map((L) => L.el), { clearProps: "textShadow" }, 5.5);
      tl.set("#stage", { clearProps: "filter" }, 5.5);

      // barrido diagonal: dos pasadas de izquierda a derecha
      gsap.set("#sweep", { x: -520, opacity: 0 });
      [3.15, 4.35].forEach((t0) => {
        tl.to("#sweep", { opacity: 1, duration: 0.10 }, t0);
        tl.fromTo("#sweep", { x: -520 }, { x: 1180, duration: 0.95, ease: "power1.inOut" }, t0);
        tl.to("#sweep", { opacity: 0, duration: 0.14 }, t0 + 0.88);
      });

      /* ---- 4) 5.5–8.0  SPLIT y SHATTER ---- */
      // parámetros sembrados: mismo orden de consumo en cada ejecución
      const shards = [];
      ALL.forEach((lt) => {
        lt.frags.forEach((f, k) => {
          shards.push({
            f,
            x: (rnd() - 0.5) * 900,
            y: 160 + rnd() * 780,
            rx: (rnd() - 0.5) * 220,
            ry: (rnd() - 0.5) * 220,
            rz: (rnd() - 0.5) * 140,
            sc: 0.45 + rnd() * 0.65,
            d: rnd() * 0.42,
          });
        });
      });
      gsap.set(shards.map((s) => s.f), { opacity: 0 });

      // el glifo base desaparece y las piezas toman su lugar
      tl.set(ALL.map((l) => l.base), { opacity: 0 }, 5.55);
      tl.set(shards.map((s) => s.f), { opacity: 1 }, 5.55);
      shards.forEach((s) => {
        tl.to(s.f, {
          x: s.x, y: s.y, rotationX: s.rx, rotationY: s.ry, rotation: s.rz,
          scale: s.sc, opacity: 0, filter: "blur(12px)",
          duration: 1.05, ease: "power2.in"
        }, 5.6 + s.d);
      });

      /* ---- cierre: destello dorado + logo ---- */
      gsap.set(["#plate", "#logo"], { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" });
      gsap.set("#flash", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" });
      tl.to("#flash", { opacity: 0.92, scale: 1.2, duration: 0.14, ease: "power2.out" }, 6.48);
      tl.to("#flash", { opacity: 0, scale: 1.65, duration: 0.5, ease: "power2.in" }, 6.62);
      tl.to(["#plate", "#logo"], { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 6.58);
      tl.to(["#plate", "#logo"], { scale: 1.02, duration: 0.85, ease: "power1.out" }, 7.15);

      /* ============ API pedida + contrato HyperFrames ============ */
      window.tl = tl;
      window.__timelines["main"] = tl;
      window.DURATION = () => 8;
      window.SEEK = (t) => {
        const d = window.DURATION();
        tl.seek(Math.max(0, Math.min(t, d)), false);
      };
      window.SEEK(0);
      window.READY = true;
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { window.READY = true; });
      }
    </script>
  </body>
</html>
