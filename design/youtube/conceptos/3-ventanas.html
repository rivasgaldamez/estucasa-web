<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Concepto 3 — Ventanas a El Salvador</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F6F1E7;--night:#07132F;--deep:#0D2060;--blue:#1B3A9C;--sun:#F5A800;--sun-soft:#FFD060}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1440px;overflow:hidden}
  body{background:var(--night);font-family:'Figtree',sans-serif;-webkit-font-smoothing:antialiased;position:relative}

  .field{position:absolute;inset:0;
    background:
      radial-gradient(ellipse 1500px 760px at 72% 50%, rgba(245,168,0,.20) 0%, rgba(245,168,0,.06) 44%, transparent 70%),
      radial-gradient(ellipse 1400px 900px at 18% 46%, rgba(27,58,156,.34) 0%, transparent 66%),
      linear-gradient(160deg, #0A1940 0%, var(--night) 48%, #050D24 100%);}
  /* Retícula tenue: planta arquitectónica */
  .plan{position:absolute;inset:0;opacity:.5;
    background:
      repeating-linear-gradient(90deg, rgba(246,241,231,.045) 0 1px, transparent 1px 128px),
      repeating-linear-gradient(0deg, rgba(246,241,231,.045) 0 1px, transparent 1px 128px);}
  .vfade{position:absolute;inset:0;background:linear-gradient(180deg,
    var(--night) 0%, rgba(7,19,47,.62) 24%, transparent 36%,
    transparent 64%, rgba(7,19,47,.62) 76%, var(--night) 100%)}

  .band{position:absolute;left:0;right:0;top:508.5px;height:423px}
  .band::before,.band::after{content:'';position:absolute;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(245,168,0,.32) 20%,rgba(245,168,0,.32) 80%,transparent)}
  .band::before{top:0}.band::after{bottom:0}

  /* Filete vertical dorado: ancla el bloque de marca */
  .safe::before{content:'';position:absolute;left:-34px;top:64px;bottom:64px;width:2px;
    background:linear-gradient(180deg,transparent,rgba(245,168,0,.55),transparent)}
  .safe{position:absolute;left:50%;top:508.5px;transform:translateX(-50%);
    width:1546px;height:423px;display:flex;align-items:center;gap:40px;padding:0 6px}

  .plate{flex:none;width:174px;height:174px;border-radius:22px;background:var(--cream);
    display:flex;align-items:center;justify-content:center;box-shadow:0 16px 40px rgba(0,0,0,.5)}
  .plate img{width:146px;height:146px;object-fit:contain;margin-top:-5px}

  .copy{flex:1 1 auto;min-width:0}
  .eyebrow{display:flex;align-items:center;gap:13px;font-size:18px;font-weight:700;
    letter-spacing:.26em;text-transform:uppercase;color:var(--sun-soft);margin-bottom:18px;white-space:nowrap}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:88px;line-height:.98;
     letter-spacing:-.02em;color:var(--cream);white-space:nowrap}
  h1 em{font-style:italic;color:var(--sun-soft)}
  .sub{margin-top:19px;font-size:23px;color:rgba(246,241,231,.84);white-space:nowrap}
  .sub b{color:#fff;font-weight:600}
  .site{margin-top:17px;font-size:19px;font-weight:700;color:var(--sun-soft)}

  /* Ventanas: arcos que dejan ver El Salvador */
  .wins{flex:none;display:flex;align-items:flex-end;gap:20px;position:relative}
  .wins::after{content:'';position:absolute;left:-40px;right:-40px;bottom:-30px;height:60px;
    background:radial-gradient(ellipse 60% 100% at 50% 0%, rgba(245,168,0,.30), transparent 72%)}
  .win{width:162px;height:272px;position:relative;overflow:hidden;
    border-radius:81px 81px 10px 10px;
    border:2px solid rgba(255,208,96,.55);
    box-shadow:0 0 0 1px rgba(7,19,47,.6), 0 22px 50px rgba(0,0,0,.55),
               0 0 46px rgba(245,168,0,.18);}
  .win img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.22) brightness(1.2)}
  .win::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(255,208,96,.10) 0%, transparent 34%, rgba(7,19,47,.42) 100%)}
  .w2{height:300px}
  .w1{height:252px}

  .guides{display:none}body.show-guides .guides{display:block}
  .g1{position:absolute;left:50%;top:508.5px;transform:translateX(-50%);width:1546px;height:423px;border:3px dashed #FF5A5F}
</style>
</head>
<body>
  <div class="field"></div><div class="plan"></div><div class="vfade"></div>
  <div class="band"></div>

  <div class="safe">
    <div class="plate"><img src="logo.png" alt="ES Tu Casa"></div>

    <div class="copy">
      <div class="eyebrow">Inmobiliaria · El Salvador</div>
      <h1>El Salvador <em>es tu casa.</em></h1>
      <div class="sub">Casas frente al mar y terrenos para el <b>Hermano Lejano</b></div>
      <div class="site">estucasasv.com</div>
    </div>

    <div class="wins">
      <div class="win w1"><img src="fotos/g-limpia.jpg" alt=""></div>
      <div class="win w2"><img src="fotos/c-limpia.jpg" alt=""></div>
      <div class="win w3"><img src="fotos/b-limpia.jpg" alt=""></div>
    </div>
  </div>

  <div class="guides"><div class="g1"></div></div>
<script>if(new URLSearchParams(location.search).get('guides')==='1')document.body.classList.add('show-guides');</script>
</body>
</html>
