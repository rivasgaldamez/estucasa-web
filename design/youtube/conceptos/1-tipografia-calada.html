<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Concepto 1 — Tipografía calada</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F6F1E7;--night:#050F33;--blue:#1B3A9C;--sun:#F5A800;--sun-soft:#FFD060}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1440px;overflow:hidden}
  body{background:var(--night);font-family:'Figtree',sans-serif;-webkit-font-smoothing:antialiased;position:relative}

  /* Textura de fondo: la misma foto, muy apagada, solo como atmósfera */
  .atmos{position:absolute;inset:0;overflow:hidden}
  .atmos img{width:100%;height:100%;object-fit:cover;object-position:center 40%;
    filter:brightness(.42) saturate(1.05) blur(3px)}
  .atmos::after{content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse 1600px 820px at 30% 50%, rgba(27,58,156,.42) 0%, transparent 68%),
               linear-gradient(150deg, #0B1C4A 0%, rgba(5,15,51,.72) 52%, #040B22 100%)}
  .vig{position:absolute;inset:0;
    background:radial-gradient(ellipse 1800px 900px at 50% 50%, transparent 0%, rgba(5,15,51,.72) 62%, var(--night) 100%)}
  .fade{position:absolute;inset:0;background:linear-gradient(180deg,
    var(--night) 0%, rgba(5,15,51,.55) 30%, rgba(5,15,51,.45) 70%, var(--night) 100%)}

  .band{position:absolute;left:0;right:0;top:508.5px;height:423px}
  /* Reglas finas que cruzan todo el ancho: estructura editorial */
  .band::before,.band::after{content:'';position:absolute;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(246,241,231,.20) 22%,rgba(246,241,231,.20) 78%,transparent)}
  .band::before{top:0}.band::after{bottom:0}

  .safe{position:absolute;left:50%;top:508.5px;transform:translateX(-50%);
    width:1546px;height:423px;display:flex;align-items:center;gap:46px;padding:0 6px}

  .mark{flex:none;display:flex;flex-direction:column;align-items:center;gap:14px}
  .mark img{width:132px;height:132px;object-fit:contain;
    background:var(--cream);border-radius:22px;padding:12px;
    box-shadow:0 14px 34px rgba(0,0,0,.45)}
  .mark span{font-size:13px;font-weight:700;letter-spacing:.2em;color:rgba(246,241,231,.55);text-transform:uppercase}

  .lock{flex:1 1 auto;min-width:0}
  .kicker{display:flex;align-items:center;gap:16px;margin-bottom:10px}
  .kicker b{font-size:21px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--cream);white-space:nowrap}
  .kicker i{flex:1 1 auto;height:1px;background:linear-gradient(90deg,var(--sun),rgba(245,168,0,0))}

  /* El recurso: la foto vive DENTRO de las letras */
  .big{font-family:'Instrument Serif',serif;font-size:196px;line-height:.86;letter-spacing:-.03em;
    background-image:url('fotos/i-limpia.jpg');
    background-size:2100px auto;background-position:center 16%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:brightness(1.3) saturate(1.3) contrast(1.06);
    white-space:nowrap;display:inline-block}
  .big em{font-style:italic}

  .foot{margin-top:18px;display:flex;align-items:center;gap:18px}
  .foot .t{font-size:25px;color:rgba(246,241,231,.88);white-space:nowrap}
  .foot .t b{color:#fff;font-weight:600}
  .foot .s{font-size:20px;font-weight:700;color:var(--sun-soft);margin-left:auto;white-space:nowrap}

  .guides{display:none}body.show-guides .guides{display:block}
  .g1{position:absolute;left:50%;top:508.5px;transform:translateX(-50%);width:1546px;height:423px;border:3px dashed #FF5A5F}
</style>
</head>
<body>
  <div class="atmos"><img src="fotos/a-limpia.jpg" alt=""></div>
  <div class="vig"></div><div class="fade"></div>
  <div class="band"></div>

  <div class="safe">
    <div class="mark">
      <img src="logo.png" alt="ES Tu Casa">
    </div>

    <div class="lock">
      <div class="kicker"><b>El Salvador es</b><i></i></div>
      <div class="big">TU <em>casa</em>.</div>
      <div class="foot">
        <div class="t">Casas frente al mar y terrenos para el <b>Hermano Lejano</b></div>
        <div class="s">estucasasv.com</div>
      </div>
    </div>
  </div>

  <div class="guides"><div class="g1"></div></div>
<script>if(new URLSearchParams(location.search).get('guides')==='1')document.body.classList.add('show-guides');</script>
</body>
</html>
